<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴哈精華區-天外寶物掉落搜尋工具</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-search"></i> 巴哈精華區-天外寶物掉落搜尋工具</h1>
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="search-query" placeholder="輸入查找寶物關鍵字，不要打錯字" class="search-input">
                <button id="search-button" class="search-btn">
                    <i class="fas fa-search"></i> 搜尋
                </button>
            </div>
        </div>
        
        <div class="results-header">
            <h2 id="results-count">準備搜尋巴哈姆特掉寶資料頁面...</h2>
            <div class="loading hidden" id="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i> 搜尋中...
            </div>
        </div>
        
        <div id="results-container" class="results-container"></div>
        <div class="footer"><p>by 羽墨 :  故障通知我</p></div>
    </div>

    <script src="all.js"></script>
</body>
</html>
